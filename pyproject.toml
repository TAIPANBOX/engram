[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engdbram"
version = "2.2.1"
description = "Embeddable cognitive memory layer for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Yurii Kostiuk", email = "yukosemail@gmail.com" }]
keywords = ["ai", "agents", "memory", "llm", "vector-database", "cognitive-architecture"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "sqlite-vec>=0.1.0",
    "fastembed>=0.3.0",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
gemini = ["google-genai>=1.0.0"]
mcp = ["mcp>=1.27.0,<2.0.0"]
langchain = ["langchain-core>=0.1"]
llamaindex = ["llama-index-core>=0.10"]
encryption = ["sqlcipher3>=0.4.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "mcp>=1.27.0,<2.0.0",
    "langchain-core>=0.1",
    "llama-index-core>=0.10",
    "google-genai>=1.0.0",
    "jsonschema>=4.20",
]

[project.scripts]
engram       = "engram.cli:main"
engram-bench = "engram.benchmarks.cli:main"
engram-mcp   = "engram.mcp_server:main"

[project.urls]
Homepage = "https://github.com/TAIPANBOX/engram"
Repository = "https://github.com/TAIPANBOX/engram"
Documentation = "https://github.com/TAIPANBOX/engram#readme"
Changelog = "https://github.com/TAIPANBOX/engram/blob/main/CHANGELOG.md"
Issues = "https://github.com/TAIPANBOX/engram/issues"

[tool.hatch.build.targets.wheel]
packages = ["engram"]
# Ship the PEP 561 marker so downstream consumers get our type hints.
force-include = { "engram/py.typed" = "engram/py.typed" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
# Markdown is documentation, not source. Ruff 0.16 began formatting Python
# code blocks inside `.md`, and its first act was to collapse the aligned
# trailing comments in the README's examples, which are aligned on purpose
# because a reader scans them as a column. The dev pin here is `ruff>=0.6`,
# so CI installs whatever is newest and a developer runs whatever they have;
# that drift is what turned a formatting opinion into a red build nobody
# could reproduce locally. The samples still get linted, they are just not
# reformatted.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Integration files depend on optional packages; exempt from strict checking.
# engram.mcp_server is intentionally NOT exempted: it must pass --strict
# (the mcp SDK ships a py.typed marker and is a pinned dev dependency).
module = ["engram.adapters.*", "engram.benchmarks.*", "engram.cli"]
ignore_errors = true

[[tool.mypy.overrides]]
# Optional encryption backend; not installed in default CI environment.
module = ["sqlcipher3", "sqlcipher3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional Gemini SDK. Suppress the missing-import error when it isn't
# installed (no inline ignore needed, so the check passes whether or not the
# google-genai package — which ships py.typed — is present).
module = ["google", "google.genai", "google.genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
