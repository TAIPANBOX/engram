<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/>
  </pattern>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,1 L8,4.5 L0,8 z" fill="#4b5563"/>
  </marker>
  <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,1 L8,4.5 L0,8 z" fill="#2dd4bf"/>
  </marker>
  <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,1 L8,4.5 L0,8 z" fill="#4493f8"/>
  </marker>
</defs>

<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>
<rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

<text x="48" y="58" fill="#e6edf3" font-size="25" font-weight="600">recall(query, k)</text>
<text x="48" y="84" fill="#8b949e" font-size="14">Two retrievers over one store, blended. Every filter is evaluated inside its own scan, never after it.</text>

<!-- query -->
<rect x="48" y="286" width="150" height="66" rx="9" fill="#111823" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="123" y="313" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">query</text>
<text x="123" y="333" fill="#8b949e" font-size="11.5" text-anchor="middle">natural language</text>

<path d="M 198 305 L 258 305 L 258 190 L 300 190" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
<path d="M 198 333 L 258 333 L 258 452 L 300 452" fill="none" stroke="#4493f8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

<circle r="4" fill="#2dd4bf">
  <animateMotion dur="3.6s" repeatCount="indefinite" path="M 198 305 L 258 305 L 258 190 L 300 190"/>
  <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#4493f8">
  <animateMotion dur="3.6s" repeatCount="indefinite" path="M 198 333 L 258 333 L 258 452 L 300 452"/>
  <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" repeatCount="indefinite"/>
</circle>

<!-- vector branch -->
<rect x="300" y="150" width="212" height="80" rx="9" fill="#0f1620" stroke="#1f2a37" stroke-width="1.2"/>
<text x="318" y="178" fill="#2dd4bf" font-size="13" font-weight="600">embed</text>
<text x="318" y="199" fill="#8b949e" font-size="11.5">bge-small-en-v1.5, 384 dim</text>
<text x="318" y="217" fill="#6e7681" font-size="11">local ONNX, no API key</text>

<rect x="556" y="126" width="286" height="128" rx="9" fill="#0f1620" stroke="#2dd4bf" stroke-width="1.4"/>
<text x="574" y="153" fill="#2dd4bf" font-size="13" font-weight="600">vec0 exact KNN</text>
<text x="574" y="176" fill="#c9d1d9" font-size="11.5">agent_id  is a partition key</text>
<text x="574" y="196" fill="#c9d1d9" font-size="11.5">ts  is a metadata column</text>
<text x="574" y="220" fill="#6e7681" font-size="11">both are constraints on the scan itself, so k</text>
<text x="574" y="236" fill="#6e7681" font-size="11">counts only rows that already passed them</text>

<!-- fts branch -->
<rect x="300" y="412" width="212" height="80" rx="9" fill="#0f1620" stroke="#1f2a37" stroke-width="1.2"/>
<text x="318" y="440" fill="#4493f8" font-size="13" font-weight="600">tokenise</text>
<text x="318" y="461" fill="#8b949e" font-size="11.5">terms joined with OR</text>
<text x="318" y="479" fill="#6e7681" font-size="11">an AND would demand every word</text>

<rect x="556" y="388" width="286" height="128" rx="9" fill="#0f1620" stroke="#4493f8" stroke-width="1.4"/>
<text x="574" y="415" fill="#4493f8" font-size="13" font-weight="600">FTS5 BM25</text>
<text x="574" y="438" fill="#c9d1d9" font-size="11.5">ranks by how many terms match</text>
<text x="574" y="458" fill="#c9d1d9" font-size="11.5">and how rare each one is</text>
<text x="574" y="482" fill="#6e7681" font-size="11">catches names, places and identifiers</text>
<text x="574" y="498" fill="#6e7681" font-size="11">that an embedding blurs into neighbours</text>

<path d="M 512 190 L 548 190" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
<path d="M 512 452 L 548 452" fill="none" stroke="#4493f8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

<!-- normalise + blend -->
<path d="M 842 190 L 892 190 L 892 288 L 928 288" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
<path d="M 842 452 L 892 452 L 892 350 L 928 350" fill="none" stroke="#4493f8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

<circle r="4" fill="#2dd4bf">
  <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M 842 190 L 892 190 L 892 288 L 928 288"/>
  <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#4493f8">
  <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M 842 452 L 892 452 L 892 350 L 928 350"/>
  <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
</circle>

<rect x="928" y="256" width="264" height="126" rx="9" fill="#111823" stroke="url(#accent)" stroke-width="1.6"/>
<text x="1060" y="284" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">normalise, then blend</text>
<text x="1060" y="312" fill="#c9d1d9" font-size="12.5" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">0.7 x cosine  +  0.3 x bm25</text>
<text x="1060" y="336" fill="#6e7681" font-size="11" text-anchor="middle">each pool min-max scaled to [0, 1]</text>
<text x="1060" y="356" fill="#6e7681" font-size="11" text-anchor="middle">so one scale cannot swamp the other</text>
<text x="1060" y="374" fill="#8b949e" font-size="11" text-anchor="middle">weights are per call</text>

<path d="M 1060 382 L 1060 424" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="960" y="430" width="200" height="58" rx="9" fill="#111823" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="1060" y="455" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">top k episodes</text>
<text x="1060" y="474" fill="#8b949e" font-size="11.5" text-anchor="middle">12 ms per query</text>

<!-- measured strip -->
<rect x="48" y="548" width="1184" height="62" rx="9" fill="#0f1620" stroke="#1f2a37" stroke-width="1.2"/>
<text x="68" y="573" fill="#8b949e" font-size="11.5">Measured on all 500 questions of LongMemEval-S, 246 738 turns, one episode per turn</text>
<text x="68" y="594" fill="#6e7681" font-size="11">records in benchmarks/results/</text>

<text x="600" y="571" fill="#6e7681" font-size="11">turn recall @5</text>
<text x="600" y="594" fill="#2dd4bf" font-size="15" font-weight="600">0.820</text>
<text x="660" y="594" fill="#6e7681" font-size="11.5">hybrid</text>
<text x="726" y="594" fill="#8b949e" font-size="15">0.772</text>
<text x="782" y="594" fill="#6e7681" font-size="11.5">cosine only</text>

<text x="900" y="571" fill="#6e7681" font-size="11">scoped recall, 100k store</text>
<text x="900" y="594" fill="#2dd4bf" font-size="15" font-weight="600">0.09 ms</text>
<text x="975" y="594" fill="#6e7681" font-size="11.5">flat, an agent pays for its own episodes</text>
</svg>
