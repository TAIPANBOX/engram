<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2dd4bf" flood-opacity="0.5"/>
  </filter>
</defs><rect x="0" y="0" width="1280" height="720" rx="0" ry="0" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/><rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/><text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="end">github.com/TAIPANBOX/engram</text><text x="40" y="56" font-size="28" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">Four ways to recall</text><text x="40" y="84" font-size="15" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">One recall() API, three ranking strategies, and a time axis that works across all of them.</text><line x1="40" y1="100" x2="1240" y2="100" stroke="#222b38" stroke-width="1"/><rect x="78.0" y="305.0" width="180" height="110" rx="42.3" ry="42.3" fill="#1a212c" stroke="#2dd4bf" stroke-width="2" filter="url(#glow)"/><text x="168.0" y="358.0" font-size="18" fill="#2dd4bf" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">recall()</text><text x="168.0" y="377.0" font-size="12" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">query, k=5</text><text x="168.0" y="395.0" font-size="10" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">mode=...</text><rect x="520" y="150" width="330" height="150" rx="14" ry="14" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/><rect x="520" y="150" width="6" height="150" rx="3" ry="3" fill="#2dd4bf" stroke="#283341" stroke-width="1"/><circle cx="554" cy="188" r="13" fill="none" stroke="#2dd4bf" stroke-width="2"/><circle cx="554" cy="188" r="4" fill="#2dd4bf"/><text x="578" y="186" font-size="17" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">cosine</text><text x="578" y="208" font-size="10" fill="#2dd4bf" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start" letter-spacing="1.5">DEFAULT</text><line x1="544" y1="226" x2="826" y2="226" stroke="#222b38" stroke-width="1"/><text x="544" y="250" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" text-anchor="start">mode="cosine"</text><text x="544" y="274" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">pure semantic similarity (sqlite-vec KNN)</text><rect x="880" y="150" width="330" height="150" rx="14" ry="14" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/><rect x="880" y="150" width="6" height="150" rx="3" ry="3" fill="#4493f8" stroke="#283341" stroke-width="1"/><circle cx="914" cy="188" r="13" fill="none" stroke="#4493f8" stroke-width="2"/><circle cx="914" cy="188" r="4" fill="#4493f8"/><text x="938" y="186" font-size="17" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">hybrid</text><text x="938" y="208" font-size="10" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start" letter-spacing="1.5">BLENDED</text><line x1="904" y1="226" x2="1186" y2="226" stroke="#222b38" stroke-width="1"/><text x="904" y="250" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" text-anchor="start">mode="hybrid"</text><text x="904" y="274" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">FTS5 BM25 + cosine, tunable blend weights</text><rect x="520" y="330" width="330" height="150" rx="14" ry="14" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/><rect x="520" y="330" width="6" height="150" rx="3" ry="3" fill="#3fb950" stroke="#283341" stroke-width="1"/><circle cx="554" cy="368" r="13" fill="none" stroke="#3fb950" stroke-width="2"/><circle cx="554" cy="368" r="4" fill="#3fb950"/><text x="578" y="366" font-size="17" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">spreading</text><text x="578" y="388" font-size="10" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start" letter-spacing="1.5">GRAPH</text><line x1="544" y1="406" x2="826" y2="406" stroke="#222b38" stroke-width="1"/><text x="544" y="430" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" text-anchor="start">mode="spreading"</text><text x="544" y="454" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">KNN seeds, BFS over Hebbian edges</text><rect x="880" y="330" width="330" height="150" rx="14" ry="14" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/><rect x="880" y="330" width="6" height="150" rx="3" ry="3" fill="#e3b341" stroke="#283341" stroke-width="1"/><circle cx="914" cy="368" r="13" fill="none" stroke="#e3b341" stroke-width="2"/><circle cx="914" cy="368" r="4" fill="#e3b341"/><text x="938" y="366" font-size="17" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">as_of</text><text x="938" y="388" font-size="10" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start" letter-spacing="1.5">TEMPORAL</text><line x1="904" y1="406" x2="1186" y2="406" stroke="#222b38" stroke-width="1"/><text x="904" y="430" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" text-anchor="start">as_of=&lt;datetime&gt;</text><text x="904" y="454" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">bitemporal time travel, any mode</text><path d="M 258.0 330.0 C 386.0 330.0, 386.0 225.0, 508.0 225.0" fill="none" stroke="#2dd4bf" stroke-width="1.8" opacity="0.6"/><path d="M 514.0 225.0 l -9 -5 l 0 10 z" fill="#2dd4bf" opacity="0.8999999999999999"/><path d="M 258.0 345.0 C 566.0 345.0, 566.0 225.0, 868.0 225.0" fill="none" stroke="#4493f8" stroke-width="1.8" opacity="0.45"/><path d="M 874.0 225.0 l -9 -5 l 0 10 z" fill="#4493f8" opacity="0.75"/><path d="M 258.0 375.0 C 386.0 375.0, 386.0 405.0, 508.0 405.0" fill="none" stroke="#3fb950" stroke-width="1.8" opacity="0.6"/><path d="M 514.0 405.0 l -9 -5 l 0 10 z" fill="#3fb950" opacity="0.8999999999999999"/><path d="M 258.0 390.0 C 566.0 390.0, 566.0 405.0, 868.0 405.0" fill="none" stroke="#e3b341" stroke-width="1.8" opacity="0.45"/><path d="M 874.0 405.0 l -9 -5 l 0 10 z" fill="#e3b341" opacity="0.75"/><rect x="520" y="510" width="690" height="126" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="url(#soft)"/><text x="546" y="542" font-size="14" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start">score = α·cosine_similarity + β·graph_activation + γ·importance_score</text><text x="546" y="566" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="start">every mode returns SearchResult[]: episode, score (0-1), distance, importance</text><text x="546" y="588" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="start">as_of filters candidates to what existed at that timestamp before ranking</text><text x="546" y="610" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="start">cross_agent=True bypasses the default agent_id write scope</text><text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="end">github.com/TAIPANBOX/engram</text></svg>