tent · actors[] · tags[] · salience</text><text x="584" y="274" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">vec_episodes (KNN) + fts_episodes (BM25)</text><rect x="560" y="318" width="330" height="150" rx="14" ry="14" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/><rect x="560" y="318" width="6" height="150" rx="3" ry="3" fill="#2dd4bf" stroke="#283341" stroke-width="1"/><circle cx="594" cy="356" r="13" fill="none" stroke="#2dd4bf" stroke-width="2"/><circle cx="594" cy="356" r="4" fill="#2dd4bf"/><text x="618" y="354" font-size="17" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">Semantic facts</text><text x="618" y="376" font-size="10" fill="#2dd4bf" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start" letter-spacing="1.5">READS</text><line x1="584" y1="394" x2="866" y2="394" stroke="#222b38" stroke-width="1"/><text x="584" y="418" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" text-anchor="start">(subject, predicate, object)</text><text x="584" y="442" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">reality timeline + belief timeline, as_of travel</text><rect x="560" y="486" width="330" height="150" rx="14" ry="14" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/><rect x="560" y="486" width="6" height="150" rx="3" ry="3" fill="#3fb950" stroke="#283341" stroke-width="1"/><circle cx="594" cy="524" r="13" fill="none" stroke="#3fb950" stroke-width="2"/><circle cx="594" cy="524" r="4" fill="#3fb950"/><text x="618" y="522" font-size="17" fill="#e6edf3" font-family="