name: Release

# Publishes engdbram to PyPI when a v* tag is pushed and validated by CI.
#
# This workflow uses PyPI trusted publishing (OIDC), no long-lived API tokens.
# Configure once at https://pypi.org/manage/account/publishing/ with:
#   PyPI project:      engdbram
#   Owner:             TAIPANBOX
#   Repository name:   engram
#   Workflow name:     release.yml
#   Environment name:  pypi
#
# Tag, then push:
#   git tag -a v2.1.2 -m "v2.1.2"
#   git push origin v2.1.2

on:
  push:
    tags:
      - "v*"
  # The build job runs on a pull request that touches THIS file, and nothing
  # else does: pypi-publish stays off (see its `if`), so a pull request builds
  # the wheel and sdist and publishes nothing. Added 2026-09-02 after
  # tokenfuse's v0.4.2 failed on both Linux runners the first time its own
  # tag-only release.yml ever reached its musl leg: a workflow gated on
  # `push: tags: v*` alone is tested by exactly one event in its whole life,
  # and that event is the one where a mistake is public.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Assert tag matches pyproject version
        # Only meaningful on a tag push: GITHUB_REF on a pull request is a
        # pull ref, never refs/tags/vX.Y.Z, so this would fail every pull
        # request build for a reason that has nothing to do with the change
        # under review.
        if: github.event_name != 'pull_request'
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PROJ=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PROJ"
            exit 1
          fi

      - name: Install package + dev tooling
        run: pip install -e .[dev,langchain,llamaindex]

      - name: Lint, type-check, and test before publishing
        # A tag pushed on a broken commit must not publish to PyPI.
        run: |
          ruff check .
          ruff format --check .
          mypy engram
          pytest

      - name: Run the gates before publishing
        # The three gate scripts ran only in ci.yml's `encryption` job, which a
        # tag push does not trigger, so the checks holding invariants 1, 2 and 4
        # (including the one CLAUDE.md calls the invariant engram has paid for
        # most) were absent from the one workflow that ships bytes to users. A
        # release could publish a README whose numbers no longer matched the
        # repository, which is the exact failure 2.4.1 exists to correct.
        #
        # local-first.sh downloads the 64 MB embedding model once on a cold
        # runner and says so. Standard ubuntu-latest runner, no matrix: on a
        # public repository these minutes are free.
        run: |
          ./scripts/no-network-at-write.sh
          ./scripts/readme-numbers.sh
          ./scripts/local-first.sh

      - name: Build distributions
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    # Never on a pull request: this job publishes to PyPI through trusted
    # publishing. TokenFuse's v0.4.2 is the shape of failure a bare
    # push-tag trigger invites (2026-09-02); this guard is what stops the
    # pull_request trigger added above from also shipping a package from a
    # fork's pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/engdbram/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
