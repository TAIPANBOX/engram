name: Release

# Publishes engdbram to PyPI when a v* tag is pushed and validated by CI.
#
# This workflow uses PyPI trusted publishing (OIDC) — no long-lived API tokens.
# Configure once at https://pypi.org/manage/account/publishing/ with:
#   PyPI project:      engdbram
#   Owner:             TAIPANBOX
#   Repository name:   engram
#   Workflow name:     release.yml
#   Environment name:  pypi
#
# Tag, then push:
#   git tag -a v2.1.2 -m "v2.1.2"
#   git push origin v2.1.2

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Assert tag matches pyproject version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PROJ=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PROJ"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/engdbram/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
