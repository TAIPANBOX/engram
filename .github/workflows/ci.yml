name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,langchain,llamaindex]

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy Type Check
        run: mypy engram

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # NOTE: macOS is intentionally not in the matrix. The GitHub-hosted macOS
    # Python (actions/setup-python) is built without loadable SQLite extension
    # support, so sqlite-vec cannot load (conn.enable_load_extension is absent).
    # Engram runs fine on macOS with a Python that enables extensions
    # (e.g. Homebrew's), which the hosted runner image does not provide.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,langchain,llamaindex]

      - name: Run Pytest
        run: pytest

  encryption:
    # SQLCipher needs a system library, so it gets its own job that installs it
    # and exercises the encryption-at-rest path that the main matrix skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install SQLCipher system library
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: Install package + encryption extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,encryption]

      - name: Run encryption tests
        run: pytest tests/test_encryption.py -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,langchain,llamaindex] pip-audit

      - name: Audit dependencies (pip-audit)
        # Checks the installed environment against known CVEs (PyPI advisory DB).
        run: pip-audit --skip-editable
