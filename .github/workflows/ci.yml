name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,langchain,llamaindex]

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy Type Check
        run: mypy engram

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # NOTE: macOS is intentionally not in the matrix. The GitHub-hosted macOS
    # Python (actions/setup-python) is built without loadable SQLite extension
    # support, so sqlite-vec cannot load (conn.enable_load_extension is absent).
    # Engram runs fine on macOS with a Python that enables extensions
    # (e.g. Homebrew's), which the hosted runner image does not provide.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,langchain,llamaindex]

      - name: Run Pytest
        run: pytest

  encryption:
    # SQLCipher needs a system library, so it gets its own job that installs it
    # and exercises the encryption-at-rest path that the main matrix skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install SQLCipher system library
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: Install package + encryption extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,encryption]

      - name: Run encryption tests
        run: pytest tests/test_encryption.py -v
      - name: no network client imported at module level
        run: ./scripts/no-network-at-write.sh
      - name: published numbers match the repository
        run: ./scripts/readme-numbers.sh
      - name: local-first holds for the default install
        run: ./scripts/local-first.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,langchain,llamaindex] pip-audit

      - name: Audit dependencies (pip-audit)
        # Checks the installed environment against known CVEs (PyPI advisory DB).
        # PYSEC-2026-597: nltk, pulled transitively by the optional llamaindex
        # extra (llama-index-core), not by core Engram. No fixed version is
        # published upstream yet; revisit and drop this ignore once nltk ships a
        # patched release.
        # PYSEC-2026-3740 (added 2026-09-02, Yurii's decision): the same nltk,
        # the same optional extra. A path traversal in nltk's model save/load
        # helpers; Engram's own code imports nltk nowhere and never calls those
        # helpers, and no patched nltk was published when this was added. Same
        # rule as above: drop the ignore the day nltk ships a fix.
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-597 --ignore-vuln PYSEC-2026-3740
