name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,langchain,llamaindex]

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy Type Check
        run: mypy engram

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # NOTE: macOS is intentionally not in the matrix. The GitHub-hosted macOS
    # Python (actions/setup-python) is built without loadable SQLite extension
    # support, so sqlite-vec cannot load (conn.enable_load_extension is absent).
    # Engram runs fine on macOS with a Python that enables extensions
    # (e.g. Homebrew's), which the hosted runner image does not provide.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,langchain,llamaindex]

      - name: Run Pytest
        run: |
          floor="$(grep -v '^[[:space:]]*#' .coverage-floor | tr -d '[:space:]')"
          pytest --cov=engram --cov-report=term-missing --cov-report=json:"$RUNNER_TEMP/coverage.json" --cov-fail-under="$floor"
      # The same total, read back from the report, with the slack and the gap
      # to the target in the job summary; and the floor only rises.
      - name: coverage is not below the floor
        run: ./scripts/coverage-floor.sh check "$RUNNER_TEMP/coverage.json"
      - name: the coverage floor only rises
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:.coverage-floor > "$RUNNER_TEMP/base-floor" 2>/dev/null || rm -f "$RUNNER_TEMP/base-floor"
          ./scripts/coverage-floor.sh ratchet "$RUNNER_TEMP/base-floor"

  encryption:
    # SQLCipher needs a system library, so it gets its own job that installs it
    # and exercises the encryption-at-rest path that the main matrix skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install SQLCipher system library
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: Install package + encryption extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,encryption]

      - name: Run encryption tests
        run: pytest tests/test_encryption.py -v
      - name: no network client imported at module level
        run: ./scripts/no-network-at-write.sh
      - name: published numbers match the repository
        run: ./scripts/readme-numbers.sh
      - name: local-first holds for the default install
        run: ./scripts/local-first.sh
      - name: every scenario names a test that exists
        run: ./scripts/features-are-bound.sh
      - name: the documents say what the code does about procedural memory
        run: ./scripts/docs-match-code.sh

      - name: no pipe ends in a grep that leaves early
        run: ./scripts/no-reader-leaves-a-pipe-early.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,langchain,llamaindex] pip-audit

      - name: Audit dependencies (pip-audit)
        # Checks the installed environment against known CVEs (PyPI advisory DB).
        # The ignore list and the reason for each entry live in the script, which
        # vulnscan.yml also runs once a week.
        run: ./scripts/pip-audit.sh
